<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEDA İkram Kartı</title>
  
  <style>
    :root {
      --primary: #2C5E3B;
      --accent: #D4A373;
      --bg: #F4F1DE;
      --card-bg: #FFFFFF;
      --text: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo-title {
      color: var(--primary);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--primary);
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #E0E0E0;
      border-radius: 12px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .kvkk-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      font-size: 12px;
      color: #555;
      margin: 20px 0 24px 0;
    }

    .kvkk-box input {
      margin-top: 2px;
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:active {
      background-color: #1e4228;
    }

    .card-view {
      display: none;
    }

    .user-welcome {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .user-company {
      font-size: 13px;
      color: #777;
      margin-bottom: 24px;
    }

    .stamps-grid {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 24px;
    }

    .stamp-box {
      flex: 1;
      aspect-ratio: 1;
      border: 2px dashed #CBD5E1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #CBD5E1;
      background-color: #F8FAFC;
      transition: all 0.3s ease;
    }

    .stamp-box.filled {
      border-style: solid;
      border-color: var(--primary);
      background-color: #E8F5E9;
      color: var(--primary);
    }

    .plate-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 16px;
    }

    .reward-banner {
      display: none;
      background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      color: #E65100;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForSedaKahvaltiApp",
      authDomain: "seda-kahvalti-ikram.firebaseapp.com",
      projectId: "seda-kahvalti-ikram",
      storageBucket: "seda-kahvalti-ikram.appspot.com",
      messagingSenderId: "100000000000",
      appId: "1:100000000000:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.doc = doc;
    window.setDoc = setDoc;
    window.onSnapshot = onSnapshot;
    window.getDoc = getDoc;
  </script>
</head>
<body>

  <div class="container">
    <!-- KAYIT FORMU -->
    <div id="formView">
      <div class="logo-title">SEDA İKRAM KARTI</div>
      <div class="subtitle">İkramlarınızı tanımlamak ve kartınızı oluşturmak için bilgilerinizi girin.</div>

      <form id="registerForm">
        <div class="form-group">
          <label>Ad Soyad:</label>
          <input type="text" id="fullName" placeholder="Örn: Ahmet Yılmaz" required>
        </div>

        <div class="form-group">
          <label>Cep Telefonu:</label>
          <input type="tel" id="phone" placeholder="0 (5XX) XXX XX XX" maxlength="17" required>
        </div>

        <div class="form-group">
          <label>Çalıştığınız Şirket / Kurum (Opsiyonel):</label>
          <input type="text" id="company" placeholder="Örn: Garanti BBVA / Mahalle Sakini">
        </div>

        <div class="kvkk-box">
          <input type="checkbox" id="kvkk" required>
          <label for="kvkk" style="font-weight: normal; margin: 0; cursor: pointer;">Kişisel verilerimin KVKK kapsamında işlenmesini onaylıyorum.</label>
        </div>

        <button type="submit" class="btn-submit">SEDA İkram Kartımı Oluştur</button>
      </form>
    </div>

    <!-- DİJİTAL KART GÖRÜNÜMÜ -->
    <div id="cardView" class="card-view">
      <div class="logo-title">SEDA İKRAM KARTI</div>
      <div class="user-welcome" id="displayTitle">Hoş Geldiniz</div>
      <div class="user-company" id="displayCompany">-</div>

      <div class="stamps-grid">
        <div class="stamp-box" id="stamp1">1</div>
        <div class="stamp-box" id="stamp2">2</div>
        <div class="stamp-box" id="stamp3">3</div>
        <div class="stamp-box" id="stamp4">4</div>
        <div class="stamp-box" id="stamp5">5</div>
      </div>

      <div id="rewardBanner" class="reward-banner">
        🎉 Tebrikler! <strong>İKRAM MENÜ KAZANDINIZ.</strong> Kasaya göstererek ikramınızı alabilirsiniz.
      </div>
    </div>
  </div>

  <script>
    const phoneInput = document.getElementById('phone');

    phoneInput.addEventListener('input', (e) => {
      let x = e.target.value.replace(/\D/g, '');
      if (x.length > 11) x = x.substring(0, 11);

      let formatted = '';
      if (x.length > 0) {
        formatted = x.substring(0, 1);
      }
      if (x.length > 1) {
        formatted += ' (' + x.substring(1, 4);
      }
      if (x.length >= 4) {
        formatted += ') ' + x.substring(4, 7);
      }
      if (x.length >= 7) {
        formatted += ' ' + x.substring(7, 9);
      }
      if (x.length >= 9) {
        formatted += ' ' + x.substring(9, 11);
      }

      e.target.value = formatted;
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const rawPhone = document.getElementById('phone').value.replace(/\D/g, '');
      const company = document.getElementById('company').value.trim() || 'Belirtilmedi';

      if (rawPhone.length !== 11 || !rawPhone.startsWith('05')) {
        alert('Lütfen geçerli bir cep telefonu numarası giriniz (05XX XXX XX XX).');
        return;
      }

      const userId = 'user_' + rawPhone;
      localStorage.setItem('seda_user_id', userId);

      const userData = {
        fullName: fullName,
        phone: rawPhone,
        company: company,
        stamps: 0,
        createdAt: new Date().toISOString()
      };

      try {
        const userRef = window.doc(window.db, "customers", userId);
        const docSnap = await window.getDoc(userRef);

        if (!docSnap.exists()) {
          await window.setDoc(userRef, userData);
        }

        listenToUserCard(userId);
      } catch (err) {
        console.error("Kayıt hatası:", err);
        alert("Bir bağlantı hatası oluştu, lütfen tekrar deneyin.");
      }
    });

    function listenToUserCard(userId) {
      document.getElementById('formView').style.display = 'none';
      document.getElementById('cardView').style.display = 'block';

      const userRef = window.doc(window.db, "customers", userId);

      window.onSnapshot(userRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('displayTitle').innerText = data.fullName;
          document.getElementById('displayCompany').innerText = data.company;

          updateStampsUI(data.stamps !== undefined ? data.stamps : 0);
        }
      });
    }

    const plateSvg = `
      <div class="plate-icon">
        <svg width="10" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C5E3B" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M8 2v6a4 4 0 0 0 4 4M16 2v6a4 4 0 0 1-4 4"/></svg>
        <span>🥘</span>
        <svg width="10" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C5E3B" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M12 2a6 6 0 0 1 6 6v4h-6"/></svg>
      </div>
    `;

    function updateStampsUI(count) {
      for (let i = 1; i <= 5; i++) {
        const box = document.getElementById(`stamp${i}`);
        if (i <= count) {
          box.classList.add('filled');
          box.innerHTML = plateSvg;
        } else {
          box.classList.remove('filled');
          box.innerHTML = i;
        }
      }

      const rewardBanner = document.getElementById('rewardBanner');
      if (count >= 5) {
        rewardBanner.style.display = 'block';
      } else {
        rewardBanner.style.display = 'none';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedUserId = localStorage.getItem('seda_user_id');
      if (savedUserId) {
        listenToUserCard(savedUserId);
      }
    });
  </script>
</body>
</html>
